[package]
name = "jarsnitch-core"
description = "Static capability analysis for Minecraft plugin jars"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
miniz_oxide = "0.8"
serde_json = "1"
insta = { version = "1", features = ["json", "redactions"] }
