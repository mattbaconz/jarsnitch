[package]
name = "jarsnitch"
description = "See what a Minecraft plugin can do before you install it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["minecraft", "plugin", "security", "static-analysis", "jar"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["tests"]

[[bin]]
name = "jarsnitch"
path = "src/main.rs"

[dependencies]
jarsnitch-core = { path = "../core", version = "0.1.0" }
serde_json = "1"
