<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250">
  <desc>How a comparison works: both jars are scanned on their own, then the two reports are matched by key. A finding's key is its rule id plus its value (a host, webhook id, path or hash); libraries are keyed by group and artifact, nested jars by path, plugin fields by name. Keys only in the new jar are Adds and keys only in the old jar are Removes. A library version, nested jar hash or plugin field that differs under the same key is a Change. Findings in both are Unchanged, even if the code moved. The exit code is 2 when Adds has a High finding.</desc>
  <rect class="box" x="1" y="40" width="160" height="56" rx="4"/>
  <text class="t" x="13" y="63">old.jar</text>
  <text class="s" x="13" y="83">scanned on its own</text>
  <rect class="box" x="1" y="150" width="160" height="56" rx="4"/>
  <text class="t" x="13" y="173">new.jar</text>
  <text class="s" x="13" y="193">scanned on its own</text>

  <path class="ln" d="M161 68 H190 V110 H214"/><polygon class="ah" points="214,106 214,114 220,110"/>
  <path class="ln" d="M161 178 H190 V138 H214"/><polygon class="ah" points="214,134 214,142 220,138"/>

  <rect class="box" x="220" y="86" width="170" height="76" rx="4"/>
  <text class="t" x="232" y="110">match by key</text>
  <text class="s" x="232" y="130">rule id + value:</text>
  <text class="s" x="232" y="148">host, id, path, hash</text>
  <text class="m" x="305" y="196" text-anchor="middle">exit 2 if Adds</text>
  <text class="m" x="305" y="212" text-anchor="middle">has a High</text>

  <path class="ln" d="M390 124 H420"/>
  <path class="ln" d="M420 34 V214"/>
  <path class="ln" d="M420 34 H443"/><polygon class="ah" points="443,30 443,38 449,34"/>
  <path class="ln" d="M420 94 H443"/><polygon class="ah" points="443,90 443,98 449,94"/>
  <path class="ln" d="M420 154 H443"/><polygon class="ah" points="443,150 443,158 449,154"/>
  <path class="ln" d="M420 214 H443"/><polygon class="ah" points="443,210 443,218 449,214"/>

  <rect class="box-a" x="449" y="10" width="190" height="48" rx="4"/>
  <text class="t" x="461" y="30"><tspan class="acc">+</tspan> Adds</text>
  <text class="s" x="461" y="48">only in the new jar</text>
  <rect class="box" x="449" y="70" width="190" height="48" rx="4"/>
  <text class="t" x="461" y="90">− Removes</text>
  <text class="s" x="461" y="108">only in the old jar</text>
  <rect class="box" x="449" y="130" width="190" height="48" rx="4"/>
  <text class="t" x="461" y="150">~ Changes</text>
  <text class="s" x="461" y="168">same key, new value</text>
  <rect class="box" x="449" y="190" width="190" height="48" rx="4"/>
  <text class="t" x="461" y="210">= Unchanged</text>
  <text class="s" x="461" y="228">in both, even if moved</text>
</svg>
