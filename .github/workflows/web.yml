name: web

# On the tag, not on the release: a release created by release.yml's token wouldn't start this.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup target add wasm32-unknown-unknown
      - run: ./scripts/build-web.sh
      - run: node scripts/check-web.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The action defaults to Wrangler 3, which cannot deploy a Worker that only serves files.
          wranglerVersion: "4.152.0"
          command: deploy
