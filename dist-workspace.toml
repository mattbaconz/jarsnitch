[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
# Static on Linux: Minecraft hosts often run distros with an old glibc.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
install-path = "CARGO_HOME"
install-updater = false
# Build only the CLI package: the wasm crate is a cdylib, which musl cannot produce.
precise-builds = true

# GitHub no longer runs jobs on macos-14, which dist 0.32 picks for Apple silicon.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
